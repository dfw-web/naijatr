    <script>
      // Smart TV detection (ES5: TV browsers are often old). Runs before the ad
      // tags so they can be skipped on TVs. ?tv=1 / ?tv=0 forces it and is remembered.
      (function () {
        var tv = false, forced = null
        try {
          var q = /[?&]tv=([01])/.exec(location.search)
          if (q) localStorage.setItem('naijatr:tv', q[1])
          forced = localStorage.getItem('naijatr:tv')
        } catch (e) {}
        if (forced === '1' || forced === '0') {
          tv = forced === '1'
        } else {
          tv = /Tizen|Web0S|SMART-TV|SmartTV|AFT[A-Z]|Android TV|GoogleTV|CrKey|BRAVIA|HbbTV|NetCast/i.test(navigator.userAgent || '')
          // Large screen, no touch and no pointer at all: a D-pad-only device.
          if (!tv && window.matchMedia && screen.width >= 1280 && !navigator.maxTouchPoints && !('ontouchstart' in window)) {
            tv = matchMedia('(any-pointer: none)').matches
          }
        }
        if (tv) document.documentElement.className += ' tv-mode'
      })()
    </script>
