<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050508" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NAIJA TR Telegram</title>
    <!-- Counts the visit, then opens the channel (src/telegram/go.ts). No ads on this page. -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #050508;
        color: #f5f5f7;
        font-family: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 14px;
        max-width: 26rem;
      }
      .marks {
        display: flex;
        gap: 8px;
      }
      .marks img,
      .marks svg {
        width: 48px;
        height: 48px;
        border-radius: 10px;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .official {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #e50914;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        vertical-align: 2px;
      }
      p {
        margin: 0;
        color: #b3b3bd;
        line-height: 1.5;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        background: #e50914;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a.home {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        color: #b3b3bd;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="marks" aria-hidden="true">
        <img src="/favicon.svg" alt="" />
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff" /><path fill="#229ED9" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" /></svg>
      </div>
      <h1>NAIJA TR Official Channel<span class="official">OFFICIAL</span></h1>
      <p>Opening the official NAIJA TR Telegram channel…</p>
      <a class="button" id="open" href="%TELEGRAM_CHANNEL_URL%">Open in Telegram</a>
      <a class="home" href="/">Back to naijatr.com</a>
    </main>
    <script type="module" src="/src/telegram/go.ts"></script>
  </body>
</html>
